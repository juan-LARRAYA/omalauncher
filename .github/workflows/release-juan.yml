name: release-juan

# Manual: build the current tip of the juan branch, run the tests, sign it with the personal key and publish a
# release. Triggered from the phone (or anywhere) with:  gh workflow run release-juan -R juan-LARRAYA/omalauncher
# The phone's "actualizar" tile then offers it; Android asks before installing and keeps Linux, widgets and layout.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed in this build
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juan

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: NDK, bsdtar and proot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          ./scripts/fetch-proot.sh
          ./scripts/build-mapas-core.sh

      - name: "Tests (a failure stops here, nothing is published)"
        run: ./gradlew :owl:test :app:testDebugUnitTest

      - name: Build and sign
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          test -n "$KS_B64" || { echo "KS_B64/KS_PASS secrets are not set"; exit 1; }
          # The launcher writes this tag at start: it's how the update tile knows what really runs.
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          last=$(gh release list -R "${{ github.repository }}" --limit 100 --json tagName --jq '[.[].tagName | capture("juan\\.b?(?<n>[0-9]+)$").n | tonumber] | max // 0')
          tag="v$ver-juan.$((last + 1))"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          ./gradlew :app:assembleRelease -PreleaseTag="$tag"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/juan.jks"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" sign --ks "$RUNNER_TEMP/juan.jks" --ks-key-alias juan --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out omalauncher-juan.apk app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs omalauncher-juan.apk | head -3
          rm -f "$RUNNER_TEMP/juan.jks"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          ver=${TAG#v}; ver=${ver%-juan.*}; n=${TAG##*.}
          gh release create "$TAG" omalauncher-juan.apk --target juan --title "OmaLauncher $ver (personal build $n)" \
            --notes "Commit $(git rev-parse --short HEAD) of juan; unit tests passed. ${NOTES}"
