[package]
name = "mapas-core"
version = "0.1.0"
edition = "2021"
description = "Offline search, car routing and public transport for Mapas: no network, no tracking"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bytemuck = "1"
memmap2 = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
unicode-normalization = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
lto = true
opt-level = 3
strip = true
panic = "abort"
